<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>계류장 내 위치</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="rampview.css?v=9">
</head>
<body>
<div class="rv">
  <header class="rv-top">
    <div class="rv-bar">
      <h1>
        <svg class="rv-logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2L13.8 8.2L21 12V13.8L13.8 11.8L13.2 17.5L16 19.5V21L12 20L8 21V19.5L10.8 17.5L10.2 11.8L3 13.8V12L10.2 8.2Z" fill="currentColor"/></svg>
        <span id="rvApt" class="rv-apt">김포</span><span class="rv-ttl">계류장 내 위치</span><span class="tag">시제품</span>
      </h1>
      <span id="rvClock"></span>
      <button id="rvSound" class="rv-ibtn" aria-pressed="false" aria-label="빨강 경고 때 소리" title="빨강 경고 때 소리"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.73 21a2 2 0 0 1-3.46 0M18.63 13A17.89 17.89 0 0 1 18 8M6.26 6.26A5.86 5.86 0 0 0 6 8c0 7-3 9-3 9h14M18 8a6 6 0 0 0-9.33-5M2 2l20 20"/></svg></button>
      <button id="rvTheme" class="rv-ibtn" aria-label="다크·라이트" title="다크·라이트"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
    </div>
    <div class="rv-sub"><span id="rvFlow"></span><span id="rvWx">기상 불러오는 중…</span><span id="rvCount"></span></div>
  </header>
  <div class="rv-map">
    <canvas id="rvMap" aria-label="계류장 평면도 — 끌어서 이동, 두 손가락으로 확대"></canvas>
    <div id="rv3dBox" hidden></div>
    <div class="rv-tools" role="toolbar" aria-label="화면 도구">
      <button id="rvApron"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M7 19V8a5 5 0 0 1 10 0v11M12 3v5"/></svg><span>계류장</span></button>
      <button id="rvAll"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg><span>전체</span></button>
      <button id="rvUp" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" fill="currentColor" stroke="none"/></svg><span>북쪽 위</span></button>
      <button id="rvLabels" aria-pressed="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><circle cx="7" cy="7" r="1.5" fill="currentColor" stroke="none"/></svg><span>편명</span></button>
      <button id="rvBase" aria-pressed="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg><span>주변 지도</span></button>
      <button id="rvHistBtn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><span>기록</span></button>
    </div>
    <div class="rv-zoom">
      <button id="rv3d" aria-pressed="false" title="3D 보기"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg><span>3D</span></button>
      <button id="rvMe" aria-pressed="false" aria-label="내 위치" title="내 위치"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg></button>
      <div class="rv-zgrp">
        <button id="rvIn" aria-label="확대"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
        <button id="rvOut" aria-label="축소"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
      </div>
    </div>
    <div id="rvBanner" hidden><b></b><small>참고용 — 관제 지시가 우선</small></div>
    <div id="rvWait">공항 도면을 불러오는 중…</div>
    <div id="rvLock">이동 중 — 지도는 내 위치를 따라갑니다</div>
  </div>
  <section id="rvPanel" class="rv-panel" aria-live="polite"></section>
  <div id="rvHist" class="rv-hist" hidden></div>
  <footer class="rv-foot">참고용 · 관제 지시 우선 · <b>운전 중 조작 금지</b> · 위치·이동 기록은 이 폰 안에서만(서버 전송 없음 · 기록은 사용자가 시작/종료) · 항공기 = AeroNexus ADS-B(공항 주변) · 경고 기준 = 가정 · 도면 = eAIP 비행장도·© OpenStreetMap 기여자(ODbL) · 지도 © 브이월드(국토교통부)</footer>
</div>
<div id="rvGate" hidden>
  <form id="rvGateF">
    <h2>초대 코드</h2>
    <p>초대받은 분만 볼 수 있습니다.</p>
    <input id="rvCode" inputmode="text" autocomplete="one-time-code" maxlength="64" aria-label="초대 코드" required>
    <button type="submit">들어가기</button>
    <p id="rvGateMsg" role="alert"></p>
  </form>
</div>
<script>
/* 껍데기 — 화면 로직·공항 자료는 서버가 초대 확인 뒤 내준다(이 저장소에는 없다) */
(function () {
  var V = '10', gate = document.getElementById('rvGate'), msg = document.getElementById('rvGateMsg');
  function boot() {
    gate.hidden = true;
    ['/app/lib/ramp-core.js', '/app/rampview.js'].reduce(function (p, src) {
      return p.then(function () { return new Promise(function (ok, no) { var s = document.createElement('script'); s.src = src + '?v=' + V; s.onload = ok; s.onerror = no; document.body.appendChild(s); }); });
    }, Promise.resolve()).catch(function () { document.getElementById('rvWait').textContent = '화면을 불러오지 못했습니다 — 서버가 쉬는 중일 수 있습니다'; });
  }
  function ask() { gate.hidden = false; document.getElementById('rvWait').textContent = ''; document.getElementById('rvCode').focus(); }
  fetch('/rv/me', { cache: 'no-store', credentials: 'same-origin' }).then(function (r) { if (r.ok) boot(); else if (r.status === 401) ask(); else if (r.status === 403) document.getElementById('rvWait').textContent = '서버 연결 설정이 맞지 않습니다(관리자 확인 필요)'; else throw 0; })
    .catch(function () { document.getElementById('rvWait').textContent = '서버가 쉬는 중입니다 — 잠시 뒤 다시 열어 주세요'; });
  document.getElementById('rvGateF').addEventListener('submit', function (e) {
    e.preventDefault(); msg.textContent = '';
    fetch('/rv/enter', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: document.getElementById('rvCode').value }) })
      .then(function (r) { return r.json().then(function (d) { if (r.ok && d.ok) boot(); else msg.textContent = d.why || '들어갈 수 없습니다'; }); })
      .catch(function () { msg.textContent = '서버에 닿지 못했습니다'; });
  });
})();
</script>
</body>
</html>
